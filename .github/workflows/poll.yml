name: Approvals & publishing
on:
  schedule:
    # Odd minutes: GitHub delays or drops scheduled runs most at :00/:10/... when its queue is busiest.
    - cron: "3,13,23,33,43,53 * * * *"
    # Extra runs right after the 07:30 America/New_York post time (11:3x UTC in EDT, 12:3x UTC in EST).
    - cron: "33,47 11,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    environment: Production   # secrets live in the Production environment
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # YouTube playlists: continent via Haiku
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_RELAY_URL: ${{ secrets.TELEGRAM_RELAY_URL }}
      TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state, not the commit at trigger time (a queued run must see the previous run's offset)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests cryptography anthropic pillow  # anthropic + pillow: YouTube playlists and their covers
      - run: python engine/pipeline.py poll
      - name: Save state
        if: always()
        run: bash scripts/commit-state.sh "poll"
