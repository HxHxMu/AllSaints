name: Approvals & publishing
on:
  schedule:
    # Odd minutes: GitHub delays or drops scheduled runs most at :00/:10/... when its queue is busiest.
    - cron: "3,13,23,33,43,53 * * * *"
    # Extra runs right after the 07:30 America/New_York post time (11:3x UTC in EDT, 12:3x UTC in EST).
    - cron: "33,47 11,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    environment: Production   # secrets live in the Production environment
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests cryptography
      - run: python engine/pipeline.py poll
      - name: Save state
        if: always()
        run: bash scripts/commit-state.sh "poll"
