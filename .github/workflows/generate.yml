name: Generate episodes
on:
  schedule:
    - cron: "17 9 * * *"   # daily ~2:17 AM Pacific
  workflow_dispatch:
    inputs:
      date:
        description: "Specific date YYYY-MM-DD (optional)"
        required: false
      max:
        description: "Max episodes this run"
        required: false
        default: "3"
permissions:
  contents: write
  actions: write
concurrency:
  group: generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          cd video && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Build calendar if missing
        run: test -f data/calendar.json || python engine/pipeline.py build-calendar
      - name: Generate
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python engine/pipeline.py generate --date "${{ github.event.inputs.date }}"
          else
            python engine/pipeline.py generate --max "${{ github.event.inputs.max || 3 }}"
          fi
      - name: Save state
        if: always()
        run: bash scripts/commit-state.sh "generate"
