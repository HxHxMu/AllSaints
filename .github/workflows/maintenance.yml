name: Maintenance
on:
  schedule:
    - cron: "41 11 * * 1"   # weekly: refresh Instagram token
    - cron: "23 12 1 * *"   # monthly: rebuild saints calendar
  workflow_dispatch:
    inputs:
      task:
        description: "refresh-token | build-calendar | whoami | yt-whoami | fb-whoami"
        required: true
        default: whoami
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    environment: Production   # secrets live in the Production environment
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then T="${{ github.event.inputs.task }}";
          elif [ "${{ github.event.schedule }}" = "41 11 * * 1" ]; then T=refresh-token; else T=build-calendar; fi
          python engine/pipeline.py $T
      - name: Save state
        if: always()
        run: bash scripts/commit-state.sh "maintenance"
