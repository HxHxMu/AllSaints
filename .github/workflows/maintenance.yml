name: Maintenance
on:
  schedule:
    - cron: "41 11 * * 1"   # weekly: refresh Instagram token
    - cron: "23 12 1 * *"   # monthly: rebuild saints calendar
    - cron: "17 10 * * *"   # nightly: dashboard numbers (allholysaints.com/dash/)
  workflow_dispatch:
    inputs:
      task:
        description: "refresh-token | build-calendar | metrics | whoami | yt-whoami | fb-whoami | tt-whoami | post <id>"
        required: true
        default: whoami
permissions:
  contents: write
  actions: read   # notify-failure.sh looks at the previous run
jobs:
  run:
    runs-on: ubuntu-latest
    environment: Production   # secrets live in the Production environment
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TT_TOKEN_KEY: ${{ secrets.TT_TOKEN_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
      DASH_INGEST_KEY: ${{ secrets.DASH_INGEST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then T="${{ github.event.inputs.task }}";
          elif [ "${{ github.event.schedule }}" = "41 11 * * 1" ]; then T=refresh-token;
          elif [ "${{ github.event.schedule }}" = "17 10 * * *" ]; then T=metrics; else T=build-calendar; fi
          python engine/pipeline.py $T
      - name: Save state
        if: always()
        run: bash scripts/commit-state.sh "maintenance"
      - name: Tell Telegram
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/notify-failure.sh "A maintenance job failed (weekly Instagram token refresh, monthly saints calendar or nightly dashboard numbers). If it's the token, Instagram stops posting once it expires." maintenance.yml
